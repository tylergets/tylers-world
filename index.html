    color: #d9ffeb; background: rgba(127, 212, 168, 0.16); outline: none;
  }
  .context-action small { color: var(--dim); font: 600 9.5px/1 var(--font); white-space: nowrap; }
  .context-action:disabled { color: #6f7c89; cursor: default; }

  /* A real web surface framed as one of the cafe's cyan/magenta terminals. */
  .internet-view {
    position: fixed; inset: 0; z-index: 45; display: grid; place-items: center;
    padding: 14px; pointer-events: auto; background: rgba(2, 7, 12, 0.82);
  }
  .internet-view[hidden] { display: none; }
  .internet-terminal {
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    width: min(1280px, calc(100vw - 28px)); height: min(860px, calc(100vh - 28px));
    overflow: hidden; color: #d9f8f2; background: #08121a;
    border: 1px solid #55d9e8; border-radius: 13px;
    box-shadow: 0 0 0 3px #182835, 0 0 42px rgba(85, 217, 232, .24), 22px 18px 0 rgba(240, 111, 182, .08);
  }
  .internet-head {
    display: flex; align-items: center; gap: 9px; padding: 10px;
    background: linear-gradient(90deg, #132633, #21172d); border-bottom: 1px solid #355363;
  }
  .internet-mark { flex: none; color: #55d9e8; font: 800 15px/1 var(--mono); letter-spacing: .08em; }
  .internet-mark span { color: #f06fb6; }
  .internet-tabs { display: flex; flex: 1; min-width: 0; gap: 3px; padding: 3px; overflow-x: auto; background: #081018; border: 1px solid #355363; border-radius: 8px; }
  .internet-tabs button { flex: none; }
  .internet-head .internet-tabs button { padding: 6px 10px; border: 0; }
  .internet-head .internet-tabs button.active { color: #081018; background: #55d9e8; }
  .internet-head form { display: flex; flex: 1; min-width: 120px; }
  .internet-head form[hidden] { display: none; }
  .internet-head input {
    min-width: 0; flex: 1; padding: 9px 11px; color: #e9ffff; background: #050b10;
    border: 1px solid #405765; border-radius: 7px 0 0 7px; outline: none; font: 12px/1 var(--mono);
  }
  .internet-head input:focus { border-color: #55d9e8; box-shadow: inset 0 0 0 1px #55d9e8; }
  .internet-head button {
    padding: 8px 11px; color: #dffbf5; background: #1a2b37; border: 1px solid #405765;
    border-radius: 7px; cursor: pointer; font: 650 11px/1 var(--font);
  }
  .internet-head form button { border-left: 0; border-radius: 0 7px 7px 0; }
  .internet-head button:hover { color: #fff; border-color: #f06fb6; background: #2a2032; }
  .internet-screen { min-height: 0; margin: 10px; overflow: hidden; background: #fff; border: 2px solid #263c49; border-radius: 5px; }
  .internet-screen iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .nes-loading { display: grid; place-items: center; height: 100%; color: #55d9e8; background: #08121a; font: 700 12px/1 var(--mono); }
  .nes-emulator {
    box-sizing: border-box; display: grid; grid-template-columns: minmax(300px, 680px) minmax(260px, 390px);
    align-content: center; justify-content: center; gap: 24px; width: 100%; height: 100%; padding: 24px;
    color: #22252b; background: radial-gradient(circle at 48% 35%, #d6d2c8, #827f79 58%, #34373b 100%);
  }
  .nes-console { min-width: 0; padding: 20px 20px 16px; background: #b9b7b0; border: 2px solid #e7e3d8; border-radius: 10px; box-shadow: 0 13px 25px rgba(0,0,0,.38), inset 0 -7px #8d8b86; }
  .nes-bezel { padding: 17px; background: #303239; border: 7px solid #474950; border-radius: 17px; box-shadow: inset 0 0 22px #000; }
  .nes-bezel canvas { display: block; width: 100%; max-height: calc(100vh - 300px); aspect-ratio: 256 / 240; background: #090a0b; image-rendering: pixelated; }
  .nes-status { min-height: 18px; margin: 11px 2px 7px; color: #4f222c; font: 700 11px/1.4 var(--mono); }
  .nes-actions { display: flex; align-items: center; gap: 9px; }
  .nes-load, .nes-actions button { padding: 9px 13px; color: #f8f5eb; background: #4c4d52; border: 0; border-radius: 4px; font: 800 10px/1 var(--mono); text-transform: uppercase; cursor: pointer; }
  .nes-load { position: relative; overflow: hidden; background: #a3243c; }
  .nes-load input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .nes-controller { align-self: center; display: grid; grid-template-columns: 110px 1fr 120px; align-items: center; gap: 16px; min-height: 170px; padding: 24px; background: #d5d2c9; border-radius: 12px 12px 34px 12px; box-shadow: 0 12px 22px rgba(0,0,0,.34), inset 0 -8px #a4a198; }
  .nes-controller button { border: 0; user-select: none; touch-action: none; cursor: pointer; }
  .nes-controller button:disabled { opacity: .35; cursor: default; }
  .nes-dpad { display: grid; grid-template: repeat(3, 36px) / repeat(3, 36px); }
  .nes-dpad button { color: transparent; background: #282a2f; box-shadow: inset 0 -3px #111; }
  .nes-dpad .up { grid-area: 1 / 2; border-radius: 4px 4px 0 0; }
  .nes-dpad .left { grid-area: 2 / 1; border-radius: 4px 0 0 4px; }
  .nes-dpad .right { grid-area: 2 / 3; border-radius: 0 4px 4px 0; }
  .nes-dpad .down { grid-area: 3 / 2; border-radius: 0 0 4px 4px; }
  .nes-system { align-self: end; display: flex; justify-content: center; gap: 8px; }
  .nes-system button { padding: 5px 8px; color: #77716f; background: #383a40; border-radius: 9px; font: 700 8px/1 var(--mono); text-transform: uppercase; }
  .nes-face { display: flex; gap: 12px; padding: 12px; background: #bbb7af; border-radius: 25px 7px 25px 7px; transform: rotate(-8deg); }
  .nes-face button { width: 44px; height: 44px; color: #fff; background: #a3243c; border-radius: 50%; box-shadow: inset 0 -4px #6f1427; font: 800 13px/1 var(--mono); }
  .nes-face button:active, .nes-system button:active, .nes-dpad button:active { transform: translateY(2px); box-shadow: none; }
  .nes-help { grid-column: 1 / -1; margin: -10px 0 0; color: #2f3033; text-align: center; font: 11px/1.4 var(--mono); }
  .internet-terminal footer { padding: 0 12px 10px; color: #829ca9; font: 10px/1.4 var(--mono); }
  .internet-terminal footer b { color: #d8f7ef; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }

  @media (max-width: 700px) {
    .internet-view { padding: 0; }
    .internet-terminal { width: 100vw; height: 100vh; border: 0; border-radius: 0; }
    .internet-head { flex-wrap: wrap; }
    .internet-head form { order: 3; flex-basis: 100%; }
    .internet-head > button:not(.internet-close) { margin-left: auto; }
    .nes-emulator { grid-template-columns: 1fr; align-content: start; gap: 12px; padding: 12px; overflow: auto; }
    .nes-bezel { padding: 8px; border-width: 4px; }
    .nes-bezel canvas { max-height: 45vh; margin: auto; }
    .nes-controller { width: min(100%, 390px); min-height: 140px; margin: auto; padding: 16px; }
    .nes-help { margin: 0; }
  }

  @media (max-width: 600px) {
    .mailbox-screen { padding: 0; }
    .mailbox-card { width: 100vw; height: 100vh; max-height: none; border: 0; border-radius: 0; }
    .mailbox-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: calc(100% - 49px); }
    .mailbox-list { display: flex; overflow-x: auto; padding: 7px; border-right: 0; border-bottom: 1px solid #b8a98c; }
    .mailbox-row { flex: 0 0 180px; }
    .letter { padding: 26px 22px; }
  }

  /* The whole opening is decoration. Someone who has asked their system not to
     animate things gets the settled picture on the first frame -- which every
     rule above is already written to be. */
  @media (prefers-reduced-motion: reduce) {
    .title, .title * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="fade"></div>
  <!-- The title screen. Static markup on purpose -- see the comment on `.title`
       in the stylesheet above: this is the picture that covers the load, so it
       has to exist before the code that does the loading does. /src/ui/title.js
       fills in the menu, including its saved-game screenshot. -->
  <div id="title" class="title">
    <svg class="tt-scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="tt-g-night" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#05070f"/>
          <stop offset="52%" stop-color="#131f3a"/>
          <stop offset="100%" stop-color="#2a3a58"/>
        </linearGradient>
        <linearGradient id="tt-g-day" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#16406e"/>
          <stop offset="26%" stop-color="#5f9dc8"/>
          <stop offset="46%" stop-color="#f2cb93"/>
          <stop offset="64%" stop-color="#eda06f"/>
          <stop offset="100%" stop-color="#d0755b"/>
        </linearGradient>
        <radialGradient id="tt-g-glow">
          <stop offset="0%" stop-color="#ffe9bd" stop-opacity="0.9"/>
          <stop offset="45%" stop-color="#ffd191" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#ffc07f" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Night, the stars, then day laid over the top and faded in. The stars
           are BETWEEN the two gradients rather than fading on a timer of their
           own, so they go out because the morning arrived. -->
      <rect width="1600" height="900" fill="url(#tt-g-night)"/>
      <g fill="#e8eefc">
        <circle cx="118" cy="96" r="2.4" opacity=".85"/><circle cx="243" cy="188" r="1.7" opacity=".6"/>
        <circle cx="352" cy="72" r="2" opacity=".75"/><circle cx="470" cy="214" r="1.5" opacity=".5"/>
        <circle cx="586" cy="118" r="2.6" opacity=".9"/><circle cx="676" cy="46" r="1.6" opacity=".55"/>
        <circle cx="792" cy="176" r="2.1" opacity=".7"/><circle cx="905" cy="88" r="1.8" opacity=".62"/>
        <circle cx="1024" cy="206" r="2.3" opacity=".8"/><circle cx="1142" cy="120" r="1.5" opacity=".5"/>
        <circle cx="1258" cy="60" r="2.5" opacity=".85"/><circle cx="1366" cy="196" r="1.7" opacity=".58"/>
        <circle cx="1478" cy="104" r="2.2" opacity=".72"/><circle cx="1556" cy="238" r="1.6" opacity=".5"/>
        <circle cx="196" cy="292" r="1.5" opacity=".42"/><circle cx="742" cy="286" r="1.6" opacity=".45"/>
        <circle cx="1198" cy="308" r="1.5" opacity=".4"/><circle cx="52" cy="200" r="1.8" opacity=".55"/>
      </g>
      <rect class="tt-day" width="1600" height="900" fill="url(#tt-g-day)"/>

      <g class="tt-sun">
        <circle cx="1146" cy="452" r="268" fill="url(#tt-g-glow)"/>
        <circle cx="1146" cy="452" r="62" fill="#fff3d2"/>
      </g>

      <!-- fill-opacity on the shapes and never `opacity` on the group: the
           group's opacity is what the dawn fade animates, and a CSS `opacity`
           beats an SVG presentation attribute, so a cloud that carried its
           paleness on the group would be painted flat white the moment the
           stylesheet loaded. -->
      <g class="tt-cloud tt-cloud-a" fill="#fff" fill-opacity=".2">
        <ellipse cx="120" cy="196" rx="104" ry="27"/>
        <ellipse cx="196" cy="180" rx="70" ry="22"/>
        <ellipse cx="58" cy="186" rx="52" ry="18"/>
      </g>
      <g class="tt-cloud tt-cloud-b" fill="#fff" fill-opacity=".13">
        <ellipse cx="150" cy="320" rx="146" ry="24"/>
        <ellipse cx="252" cy="308" rx="86" ry="19"/>
      </g>

      <g class="tt-birds" fill="none" stroke="#2c3346" stroke-width="3.4" stroke-linecap="round">
        <path class="tt-bird" d="M0 300q11-9 21 0 10-9 21 0"/>
        <path class="tt-bird" d="M52 272q9-7 17 0 8-7 17 0"/>
        <path class="tt-bird" d="M96 316q8-6 15 0 7-6 15 0"/>
      </g>

      <!-- Far ridge. Cool and desaturated, because distance is haze and haze is
           the only thing keeping three flat green shapes from reading as one. -->
      <g class="tt-ridge tt-far">
        <path fill="#5b7f8d" d="M0 900V565c118-36 214 6 322-18 116-26 196 20 314-6 128-28 226 16 352-6 118-20 226 16 340-2 96-15 178 8 272-4v391z"/>
      </g>

      <g class="tt-ridge tt-mid">
        <path fill="#4a7a5c" d="M0 900V648c142-40 262 12 402-18 138-30 240 26 388 6 148-20 268 32 410 6 128-24 264 18 400-8v266z"/>
        <g fill="#3d6b50">
          <path d="M290 646l11-28 11 28zM292 630l9-24 9 24z"/>
          <path d="M382 636l10-26 10 26zM384 621l8-22 8 22z"/>
          <path d="M1236 646l10-26 10 26zM1238 631l8-22 8 22z"/>
          <path d="M1320 648l10-26 10 26zM1322 633l8-22 8 22z"/>
        </g>
      </g>

      <!-- Near hill: the one with somebody on it. Everything standing on this
           layer is bedded to the curve above, which runs y=748..758 across the
           whole width. A tree floating a hand's width off its own hill is the
           single loudest thing a scene like this can get wrong. -->
      <g class="tt-ridge tt-near">
        <path fill="#2e5139" d="M0 900V772c186-46 348 2 536-24 190-26 350 32 566 12 176-16 330 14 498-10v150z"/>

        <g>
          <rect x="556" y="690" width="106" height="58" rx="3" fill="#e9e2d3"/>
          <path fill="#d4614f" d="M544 694l65-44 65 44z"/>
          <!-- After the roof, or the roof covers it: the chimney's foot is
               meant to be buried in the tiles and its throat is not. -->
          <rect x="622" y="636" width="13" height="32" fill="#a8503e"/>
          <g fill="#dfe6ee">
            <circle class="tt-puff" cx="629" cy="634" r="9"/>
            <circle class="tt-puff" cx="629" cy="634" r="9"/>
            <circle class="tt-puff" cx="629" cy="634" r="9"/>
          </g>
          <rect x="596" y="716" width="24" height="32" rx="2" fill="#7a5a44"/>
          <rect class="tt-lamp" x="568" y="702" width="19" height="17" rx="2" fill="#f8d98d"/>
          <rect x="631" y="702" width="19" height="17" rx="2" fill="#8fa2ac"/>
        </g>

        <g fill="#24402f">
          <rect x="782" y="750" width="9" height="18"/>
          <path d="M760 754l26-64 26 64zM762 722l24-56 24 56z"/>
          <rect x="863" y="756" width="8" height="16"/>
          <path d="M846 760l21-52 21 52zM848 734l19-46 19 46z"/>
          <rect x="1187" y="740" width="9" height="24"/>
          <circle cx="1180" cy="716" r="32"/><circle cx="1212" cy="728" r="23"/>
          <rect x="1368" y="748" width="8" height="18"/>
          <circle cx="1372" cy="730" r="26"/><circle cx="1344" cy="740" r="18"/>
          <rect x="339" y="744" width="9" height="22"/>
          <circle cx="332" cy="722" r="29"/><circle cx="364" cy="734" r="20"/>
        </g>
      </g>
    </svg>

    <div class="tt-veil"></div>

    <div class="tt-stack">
      <div class="tt-brand">
        <h1 class="tt-name"><span class="tt-name-tyler">Tyler&rsquo;s</span><span class="tt-name-world">World</span></h1>
      </div>
      <div class="tt-card" id="title-card" role="group" aria-label="Worlds and saves"></div>
      <div class="tt-note" id="title-note" role="status">Loading&hellip;</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
