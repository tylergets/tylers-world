<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237fbe57'/%3E%3Cpath d='M6 19l10-8 10 8v7H6z' fill='%23d4614f'/%3E%3C/svg%3E">
<title>Tyler's World</title>
<style>
  :root {
    --ink: #f2f5f8;
    --dim: #9fb0c2;
    --panel: rgba(16, 22, 31, 0.9);
    --edge: rgba(255, 255, 255, 0.13);
    --accent: #7fd4a8;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  /* Nothing here is a document to read at your own pace -- it is all buttons
     and lines you click through, and a click that leaves a blue smear of
     highlighted text across a dialog choice reads as a bug. Selection is off
     everywhere, and handed back only to the fields that exist to be typed in. */
  body {
    font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }

  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hud {
    position: absolute; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 12px; padding: 10px 13px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
  }
  .hud-tl { top: 16px; left: 16px; }
  .hud-tr { top: 16px; right: 16px; min-width: 186px; }
  .hud-bl { bottom: 16px; left: 16px; }
  .hud-tc { top: 16px; left: 50%; transform: translateX(-50%); }
  .hud-br { bottom: 16px; right: 16px; }

  /* The right-hand column: the map card, and under it the readouts.
     A stack rather than two independently pinned corners, because both want
     the top right and the one that is showing should not have to know whether
     the other is. Only the cards take the pointer; the gap between them stays
     click-through to the world. */
  .hud-col {
    position: absolute; top: 16px; right: 16px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    pointer-events: none;
  }
  .hud-col > .hud { position: static; }

  /* The map. Padding-free: the picture goes to the card's edge, because a
     framed map inside a framed panel is two borders saying one thing. */
  .map-card {
    position: relative; padding: 0; overflow: hidden; cursor: pointer;
    transition: opacity 0.22s;
  }
  .map-card canvas { display: block; border-radius: 11px; }
  .map-north, .map-mode {
    position: absolute; pointer-events: none;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  }
  .map-north { top: 5px; left: 50%; transform: translateX(-50%); opacity: 0.85; }
  .map-mode { right: 7px; bottom: 5px; color: var(--dim); }

  /* Go home. Directly under the map, because "where is my house" and "take me
     there" are the same question asked twice, and the map is where a player
     already goes to ask the first half of it.

     It is DISABLED rather than hidden wherever there is no marked home to walk
     to -- indoors, or in a place that has none. A control that vanishes reads
     as a bug in the layout; one that greys out reads as an answer. */
  .go-home {
    display: flex; align-items: center; gap: 8px;
    width: 186px; padding: 8px 11px;
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink);
    text-align: left; cursor: pointer;
    transition: background 0.16s, color 0.16s;
  }
  .go-home:hover:not(:disabled) { background: rgba(255, 255, 255, 0.16); }
  .go-home:disabled { color: var(--dim); cursor: default; opacity: 0.6; }
  .go-home-icon { flex: none; font-size: 13px; line-height: 1; }
  .go-home-label { flex: 1; letter-spacing: 0.02em; }

  .world-name {
    font-size: 17px; font-weight: 650; letter-spacing: -0.01em;
  }
  .place-note {
    font-size: 11px; font-weight: 600; color: var(--dim);
    letter-spacing: 0.06em; text-transform: uppercase; margin-top: 3px;
  }
  #hud-place { flex: 1; margin-bottom: 9px; }
  .panel-head { display: flex; align-items: flex-start; gap: 12px; }

  /* The settings gear.
     Small and quiet, and the way in to every control that is worth having but
     not worth looking at: the view blend, the voice, the performance panel,
     the world you are in. Everything behind it also has a key, so the drawer
     is how you FIND those controls rather than the only way to work them. */
  .gear {
    flex: none; width: 26px; height: 26px; padding: 0;
    display: grid; place-items: center;
    font: inherit; font-size: 14px; line-height: 1; color: var(--dim);
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--edge);
    border-radius: 7px; cursor: pointer;
    transition: background 0.16s, color 0.16s, border-color 0.16s;
  }
  .gear:hover { background: rgba(255, 255, 255, 0.14); color: var(--ink); }
  .gear.on {
    color: var(--accent); border-color: var(--accent);
    background: rgba(127, 212, 168, 0.16);
  }

  /* The drawer. A fixed width, so opening it cannot resize the panel around
     the world name, and a rule above it so it reads as a second section of the
     same card rather than a popover that happens to be touching. */
  .settings {
    width: 214px; margin-top: 9px; padding-top: 10px;
    border-top: 1px solid var(--edge);
  }
  .set-title {
    font-size: 10px; font-weight: 700; color: var(--dim);
    letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 7px;
  }
  .set-title + .set-title, .view-toggle + .set-title { margin-top: 11px; }
  .view-toggle {
    display: flex; align-items: center; gap: 9px; width: 100%;
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink);
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--edge);
    border-radius: 8px; padding: 6px 9px; cursor: pointer;
    transition: background 0.16s;
  }
  .view-toggle:hover { background: rgba(255, 255, 255, 0.14); }
  .view-toggle + .view-toggle { margin-top: 5px; }
  .vt-label { flex: 1; text-align: left; letter-spacing: 0.02em; }
  .vt-key {
    font: 600 10px/1 var(--mono); color: var(--dim);
    background: rgba(0, 0, 0, 0.32); border: 1px solid var(--edge);
    border-radius: 4px; padding: 3px 5px;
  }

  /* The trespass warning. Red, centred at the top, and the only thing in the
     HUD that is ever allowed to look like an alarm -- which is what buys it the
     attention it needs on the one occasion it appears. It carries no pointer
     events of its own beyond the panel's, so it can never eat a click meant for
     the world underneath. */
  .warn {
    display: flex; align-items: baseline; gap: 10px;
    background: rgba(58, 18, 20, 0.92); border-color: rgba(224, 108, 108, 0.5);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .warn-tag {
    font-size: 11px; font-weight: 700; color: #ff9b9b;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .warn-where { font-size: 13px; font-weight: 600; }
  .warn-clock { font: 600 11.5px/1 var(--mono); color: var(--dim); }
  @keyframes pulse {
    0%, 100% { border-color: rgba(224, 108, 108, 0.5); }
    50% { border-color: rgba(255, 140, 140, 0.95); }
  }

  .row { display: flex; justify-content: space-between; gap: 14px; font-size: 12px; line-height: 1.75; }
  .row .k { color: var(--dim); }
  .row .v { font-family: var(--mono); font-size: 11.5px; }

  .morph { display: flex; align-items: center; gap: 9px; }
  .morph-end { font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: 0.06em; }
  #hud-scrub { flex: 1; min-width: 0; accent-color: var(--accent); cursor: grab; }

  /* Inventory. Slot size is set here rather than derived from the chip, so a
     full slot and an empty one are exactly the same shape -- a bar that
     reflows as you pick things up is unreadable at a glance. */
  .bag-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .bag-title {
    font-size: 11px; font-weight: 700; color: var(--dim);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .bag-held { font: 500 11.5px/1 var(--mono); color: var(--ink); opacity: 0.9; }
  .bag { display: flex; gap: 5px; }
  .slot {
    position: relative; width: 34px; height: 34px; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--edge);
    border-radius: 8px; transition: border-color 0.14s, background 0.14s;
  }
  .slot:hover { background: rgba(255, 255, 255, 0.14); }
  .slot.on { border-color: var(--accent); background: rgba(127, 212, 168, 0.16); }
  .slot.empty .chip { display: none; }
  .chip {
    width: 17px; height: 17px; border-radius: 50%;
    box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.35);
  }
  /* The drawn icon that replaced the colour chip. Sized to the slot rather than
     to the drawing: every glyph is authored in the same 24-unit box (see
     ui/icons.js), so one rule sizes all of them and a new item cannot arrive at
     a different scale from its neighbours. The drop shadow is what lifts a
     flat shape off a dark panel -- without it the pale ones glow and the dark
     ones vanish. */
  .icon { width: 25px; height: 25px; display: block; overflow: visible; }
  .icon > * { filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.55)); }
  .tally {
    position: absolute; right: 2px; bottom: 1px;
    font: 700 9.5px/1 var(--mono); color: var(--ink);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
  }


  /* Conversation + trade. One column, bottom centre, riding above the pockets
     panel: the box and the panel are one overlay in two modes because a shop
     is opened from a line of dialog and closes back into another one. */
  .chat {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 74px; width: min(820px, calc(100vw - 32px));
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: auto; z-index: 5;
  }
  /* An author rule that sets display OUTRANKS the [hidden] rule in the
     browser's own stylesheet. Anything given a display here therefore has to
     say what hidden means for itself, or it sits on screen from the first
     frame with nothing in it. All three of these are toggled from JS: the chat
     box whenever a conversation opens, a readout row whenever the thing it
     reports (a doorway ahead, an item in reach, someone to talk to) is not
     there, and the trespass warning whenever you are somewhere you should not
     be -- which is the one that shows the trap at its worst, since a warning
     that is always up is a warning nobody reads. */
  .chat[hidden], .row[hidden], .warn[hidden] { display: none; }
  .chat-box {
    position: relative;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 16px; padding: 18px 22px 20px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    cursor: pointer; transition: opacity 0.18s;
  }
  /* While the shop has the screen the words behind it are context, not the
     thing you are doing. Dimming says so without moving anything. */
  .chat-box.dim { opacity: 0.7; }
  .chat-who { display: flex; align-items: baseline; gap: 11px; margin-bottom: 7px; }
  .chat-name { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 0.01em; }
  .chat-title {
    font-size: 12px; font-weight: 600; color: var(--dim);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .chat-text { font-size: 18px; line-height: 1.55; min-height: 3.1em; }
  .chat-more {
    position: absolute; right: 18px; bottom: 10px;
    font-size: 16px; color: var(--accent); animation: nudge 1.1s ease-in-out infinite;
  }
  @keyframes nudge { 0%, 100% { transform: translateY(0); opacity: 0.55; } 50% { transform: translateY(3px); opacity: 1; } }
  .chat-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 13px; }
  .choice {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; text-align: left;
    font: inherit; font-size: 16px; color: var(--ink);
    background: rgba(255, 255, 255, 0.05); border: 1px solid transparent;
    border-radius: 10px; padding: 11px 14px; cursor: pointer;
    transition: background 0.13s, border-color 0.13s;
  }
  .choice:hover { background: rgba(255, 255, 255, 0.11); }
  .choice.on { background: rgba(127, 212, 168, 0.15); border-color: var(--accent); }
  .choice-key {
    flex: none; font: 700 11px/1 var(--mono); color: var(--dim);
    background: rgba(0, 0, 0, 0.34); border: 1px solid var(--edge);
    border-radius: 5px; padding: 5px 7px;
  }

  .shop {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 16px; padding: 17px 19px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
  }
  .shop-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .shop-name {
    font-size: 13px; font-weight: 700; color: var(--dim);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .shop-coins { font-size: 14px; color: var(--dim); }
  .shop-coins b { font-family: var(--mono); font-size: 16px; color: #f3d489; }
  .shop-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .shop-tab {
    flex: 1; min-height: 44px; font: inherit; font-size: 15px; font-weight: 650; color: var(--dim);
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--edge);
    border-radius: 10px; padding: 9px 12px; cursor: pointer;
  }
  .shop-tab.on { color: var(--ink); background: rgba(127, 212, 168, 0.16); border-color: var(--accent); }
  /* Trade panel: the list on the left, one item large on the right. Fixed
     height, not max-height: a panel that grows and shrinks as stock sells out
     drags the dialog box up and down the screen mid-sentence. */
  .shop-body { display: flex; gap: 12px; align-items: stretch; }
  .shop-rows {
    flex: 1; min-width: 0;
    height: clamp(228px, 33vh, 300px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 5px;
    scrollbar-width: thin;
  }
  .shop-row {
    flex: none; display: flex; align-items: center; gap: 11px; width: 100%; min-height: 52px;
    font: inherit; font-size: 15px; color: var(--ink);
    background: rgba(255, 255, 255, 0.05); border: 1px solid transparent;
    border-radius: 10px; padding: 8px 13px; cursor: pointer;
  }
  .shop-row:hover { background: rgba(255, 255, 255, 0.11); }
  .shop-row.on { background: rgba(127, 212, 168, 0.15); border-color: var(--accent); }
  /* Unaffordable and sold-out rows stay on screen and stay clickable: the price
     of a thing you cannot buy yet is information, and hiding it makes the shelf
     look like it never stocked one. */
  .shop-row.no { opacity: 0.45; }
  /* One box for whichever of the three pictures a row got -- a rendering, a
     drawn icon or the colour chip (see #art in ui/dialogue.js). Sized here and
     not by the drawing, so a row is the same height whichever it is and a shelf
     of mixed goods does not ripple. */
  .shop-art { flex: none; width: 36px; height: 36px; display: grid; place-items: center; }
  .shop-art .icon { width: 28px; height: 28px; }
  .shop-row .chip { width: 21px; height: 21px; }
  /* A rendered model fills its box: every one is fitted to the same 100-unit
     square by ui/preview.js, so one rule sizes all of them. */
  .model { display: block; width: 100%; height: 100%; }
  .shop-label { flex: 1; }
  .shop-qty { font: 500 13px/1 var(--mono); color: var(--dim); }
  .shop-price {
    font: 600 14px/1 var(--mono); color: #f3d489; min-width: 42px; text-align: right;
  }
  .shop-empty { padding: 18px 3px; font-size: 15px; color: var(--dim); }

  /* The card. Everything on it is derived at draw time from the shop, the bag
     and the purse -- nothing here is authored per item. */
  .shop-card {
    flex: none; width: 198px; display: flex; flex-direction: column; gap: 6px;
    padding: 11px; overflow: hidden;
    background: rgba(0, 0, 0, 0.26); border: 1px solid var(--edge); border-radius: 12px;
  }
  /* The art flexes and the words do not: on a short window the PICTURE gives up
     the room, down to nothing if it has to, rather than the price being the
     thing that falls off the bottom. */
  .card-art {
    flex: 1 1 96px; min-height: 0; display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.05); border-radius: 9px; padding: 4px;
  }
  .card-art .icon { width: 62px; height: 62px; }
  .card-art .chip { width: 44px; height: 44px; }
  .card-art .model { width: 100%; height: 100%; }
  .card-name { font-size: 15px; font-weight: 650; line-height: 1.2; }
  .card-kind { font-size: 11.5px; color: var(--dim); line-height: 1.35; }
  .card-facts { display: flex; flex-direction: column; gap: 2px; margin: 0; }
  .card-facts div { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card-facts dt { font-size: 11.5px; color: var(--dim); }
  .card-facts dd { margin: 0; font: 600 12px/1.3 var(--mono); }
  .card-facts dd.coin { color: #f3d489; }
  .card-facts dd.warn { color: #ffb4b4; }
  .card-why { font-size: 11.5px; line-height: 1.35; color: #ffb4b4; }
  .card-none { margin: auto; font-size: 12.5px; color: var(--dim); text-align: center; }

  .shop-foot {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline;
    margin-top: 12px; font-size: 13px; color: var(--dim);
  }
  .shop-foot b { color: var(--ink); font-family: var(--mono); font-size: 12px; }
  .shop-foot .dim { opacity: 0.7; }
  .shop-warn { color: #ffb4b4; }
  .choice:focus-visible, .shop-tab:focus-visible, .shop-row:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  @media (max-width: 560px) {
    .chat { width: calc(100vw - 20px); }
    .chat-box { padding: 15px 16px 17px; }
    .shop { padding: 14px; }
    .shop-foot .dim { flex-basis: 100%; }
    /* Too narrow for two columns, so the card goes UNDER the list and lies on
       its side rather than being dropped. The picture is the reason the panel
       exists; a phone-shaped window is not a reason to stop showing it. */
    .shop-body { flex-direction: column; }
    .shop-rows { height: clamp(150px, 26vh, 210px); }
    .shop-card {
      width: auto; display: grid; grid-template-columns: 74px 1fr;
      gap: 3px 11px; align-content: center;
    }
    .card-art { grid-row: 1 / -1; height: 74px; min-height: 0; }
    .card-art .icon { width: 52px; height: 52px; }
  }

  /* Coins, in the pockets panel. */
  .bag-coins { font: 600 11.5px/1 var(--mono); color: #f3d489; }

  .hud-sep { height: 1px; background: var(--edge); margin: 9px 0; }
  .gpu-name {
    margin-top: 8px; max-width: 190px;
    font: 500 10px/1.45 var(--mono); color: var(--dim); opacity: 0.75;
    overflow-wrap: anywhere;
  }

  /* The key list. Two columns rather than a paragraph per line: the whole
     value of a keymap is that you can find one key without reading the others,
     and prose defeats that. Only keys that do something in the world are on
     it -- the diagnostic keys live behind the gear, with the panel they drive. */
  .keys {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 10px;
    align-items: baseline; font-size: 11.5px; color: var(--dim);
  }
  .keys b {
    justify-self: end; color: var(--ink);
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: -0.02em; white-space: nowrap;
  }
  .keys .dim { opacity: 0.62; }

  /* --------------------------------------------------------------- worlds --
     The worlds and saves panel: a real modal, and the only one in the game.
     Everything else in the HUD is a corner you can ignore, but choosing a world
     ends the one you are in -- so this takes the screen, dims what is behind
     it, and closes on Esc, which is what tells the player it is a decision
     rather than a readout. */
  .modal {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: rgba(5, 7, 10, 0.62);
    pointer-events: auto;
  }
  .modal[hidden] { display: none; }
  .modal-card {
    width: min(430px, calc(100vw - 32px));
    max-height: calc(100vh - 48px); overflow-y: auto; scrollbar-width: thin;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 15px 17px 16px;
    box-shadow: 0 18px 52px rgba(0, 0, 0, 0.55);
  }
  .modal-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 13px; }
  .modal-title { flex: 1; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .modal-esc { font: 600 10px/1 var(--mono); color: var(--dim); }
  .modal-x {
    font: inherit; font-size: 15px; line-height: 1; color: var(--dim);
    background: none; border: 0; padding: 2px 4px; cursor: pointer;
  }
  .modal-x:hover { color: var(--ink); }

  /* A choosable world, and a saved game. Same row shape on purpose: both are
     "a place you could be playing in a moment", and making them look like two
     different kinds of thing would be a lie about what the panel does. */
  .pick {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    font: inherit; font-size: 13px; color: var(--ink);
    background: rgba(255, 255, 255, 0.05); border: 1px solid transparent;
    border-radius: 9px; padding: 9px 11px; cursor: pointer;
    transition: background 0.13s, border-color 0.13s;
  }
  .pick + .pick { margin-top: 4px; }
  .pick:hover { background: rgba(255, 255, 255, 0.11); }
  .pick.on { background: rgba(127, 212, 168, 0.15); border-color: var(--accent); }
  .pick-body { flex: 1; min-width: 0; }
  .pick-name { font-weight: 620; }
  .pick-note {
    margin-top: 2px; font-size: 11px; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pick-when { flex: none; font: 500 10.5px/1 var(--mono); color: var(--dim); }
  .pick-kill {
    flex: none; font: inherit; font-size: 13px; line-height: 1; color: var(--dim);
    background: none; border: 0; padding: 3px 5px; border-radius: 5px; cursor: pointer;
  }
  .pick-kill:hover { color: #ffb4b4; background: rgba(255, 180, 180, 0.12); }

  /* The seed row. Shown only when a generated world is the selection, because
     a seed box next to "Meadowbrook" invites you to type a number that changes
     nothing. */
  .seed-row { display: flex; align-items: center; gap: 7px; margin-top: 8px; }
  .seed-row[hidden] { display: none; }
  .seed-label {
    font-size: 10px; font-weight: 700; color: var(--dim);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  #worlds-seed {
    flex: 1; min-width: 0;
    font: 600 12.5px/1 var(--mono); color: var(--ink);
    background: rgba(0, 0, 0, 0.3); border: 1px solid var(--edge);
    border-radius: 7px; padding: 7px 9px;
  }
  #worlds-seed:focus { outline: none; border-color: var(--accent); }

  .modal-actions { display: flex; gap: 7px; margin-top: 11px; }
  .btn {
    flex: 1; font: inherit; font-size: 12.5px; font-weight: 650; color: var(--ink);
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--edge);
    border-radius: 8px; padding: 8px 10px; cursor: pointer;
    transition: background 0.14s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.14); }
  .btn.go { background: rgba(127, 212, 168, 0.18); border-color: var(--accent); }
  .btn.go:hover { background: rgba(127, 212, 168, 0.3); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:disabled:hover { background: rgba(255, 255, 255, 0.07); }

  .modal-sep { height: 1px; background: var(--edge); margin: 14px 0 12px; }
  .modal-note { margin-top: 9px; font-size: 11.5px; color: var(--dim); line-height: 1.5; }
  .modal-note.bad { color: #ffb4b4; }
  .modal-empty { padding: 10px 2px; font-size: 12.5px; color: var(--dim); }

  /* Covers the swap between places. Opacity is driven from the loop, and the
     element never takes pointer events, so a fade cannot eat a click. */
  /* `will-change: opacity` is on the .fading class and NOT on the base rule,
     which matters more than it looks. On the base rule it promotes a
     FULL-SCREEN compositor layer that exists for the entire session -- sitting
     over the WebGL canvas at opacity 0, costing a blend every frame, and on
     some drivers knocking the canvas off the direct-scanout path into a full
     compositing pass. The hint is worth having for the quarter-second the fade
     actually animates and worth nothing for the hours it does not. */
  #fade {
    position: fixed; inset: 0; background: #05070a;
    opacity: 0; pointer-events: none;
  }
  #fade.fading { will-change: opacity; }


  /* ------------------------------------------------- the map tool's screen --
     A panel and NOT a `.modal`, and the difference is deliberate: the worlds
     modal dims what is behind it because it is a decision about ending the
     session, while this is a thing you are holding up while the game carries
     on underneath. So the backdrop is light, and the card is the size of the
     window rather than the size of a dialog -- a map that fits in a 430px box
     is the minimap, which the game already has in the corner. */
  .mapscreen {
    position: fixed; inset: 0; z-index: 18;
    display: grid; place-items: center;
    background: rgba(5, 7, 10, 0.45);
    pointer-events: auto;
  }
  .mapscreen[hidden] { display: none; }
  .ms-card {
    display: flex; flex-direction: column;
    width: min(1180px, calc(100vw - 40px));
    height: min(840px, calc(100vh - 40px));
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 12px 13px 10px;
    box-shadow: 0 18px 52px rgba(0, 0, 0, 0.55);
  }
  .ms-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .ms-title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .ms-zoom { font: 500 10.5px/1 var(--mono); color: var(--dim); }
  .ms-spacer { flex: 1; }
  .ms-btn {
    font: 600 11px/1 var(--mono); color: var(--dim);
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--edge);
    border-radius: 7px; padding: 5px 9px; cursor: pointer;
    transition: color 0.14s, background 0.14s, border-color 0.14s;
  }
  .ms-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.13); }
  .ms-close { color: var(--ink); }
  /* The canvas fills whatever is left, and its backing store is sized from
     `clientWidth`/`clientHeight` every frame (see MapScreen.#surface), so this
     rule is the single source of truth for how big the map is. `min-height: 0`
     is load-bearing in a flex column: without it the canvas refuses to shrink
     below its intrinsic size and pushes the footer off the card. */
  #ms-canvas {
    flex: 1; min-height: 0; width: 100%;
    border-radius: 9px; background: #0a0e14;
    border: 1px solid var(--edge);
    cursor: grab; touch-action: none;
  }
  #ms-canvas.dragging { cursor: grabbing; }
  .ms-foot {
    margin-top: 9px; font-size: 11px; color: var(--dim);
  }
  .ms-foot b {
    color: var(--ink); font: 600 10px/1 var(--mono);
    background: rgba(255, 255, 255, 0.08); border: 1px solid var(--edge);
    border-radius: 5px; padding: 3px 5px; margin-right: 3px;
  }
  .ms-dim { opacity: 0.5; margin: 0 3px; }

  /* ---------------------------------------------- the camera's photo view --
     Same panel language as the map screen, sized to the picture instead of to
     the window. The frame is dark and the image is contained rather than
     cropped, because a photograph the game has silently trimmed is not the
     photograph the player took. */
  .photoview {
    position: fixed; inset: 0; z-index: 19;
    display: grid; place-items: center;
    background: rgba(5, 7, 10, 0.55);
    pointer-events: auto;
  }
  .photoview[hidden] { display: none; }
  .pv-card {
    display: flex; flex-direction: column;
    width: min(1000px, calc(100vw - 40px));
    max-height: calc(100vh - 40px);
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 12px 13px 10px;
    box-shadow: 0 18px 52px rgba(0, 0, 0, 0.55);
  }
  .pv-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .pv-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .pv-count { font: 500 10.5px/1 var(--mono); color: var(--dim); }
  .pv-spacer { flex: 1; }
  .pv-btn {
    font: 600 11px/1 var(--mono); color: var(--dim);
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--edge);
    border-radius: 7px; padding: 5px 9px; cursor: pointer;
    transition: color 0.14s, background 0.14s, border-color 0.14s;
  }
  .pv-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.13); }
  .pv-close { color: var(--ink); }
  .pv-frame {
    flex: 1; min-height: 0; display: grid; place-items: center;
    background: #05070a; border: 1px solid var(--edge); border-radius: 9px;
    overflow: hidden;
  }
  #pv-img { max-width: 100%; max-height: min(66vh, 620px); display: block; }
  .pv-foot { margin-top: 9px; font-size: 11px; color: var(--dim); }
  .pv-foot b {
    color: var(--ink); font: 600 10px/1 var(--mono);
    background: rgba(255, 255, 255, 0.08); border: 1px solid var(--edge);
    border-radius: 5px; padding: 3px 5px; margin-right: 3px;
  }
  .pv-dim { opacity: 0.5; margin: 0 3px; }

  /* ================================================== the title screen =====
     THE SCENE IS IN THE DOCUMENT, and that is the entire trick of it. The
     markup below and these keyframes are parsed with the page, so the dawn is
     already breaking on the browser's first paint -- before /src/main.js has
     been fetched, before a WebGL context exists and long before a world file
     has come off the disk. An opening built in JS would begin at exactly the
     moment there was nothing left to cover.

     Everything that moves here moves by `opacity` and `transform` on about a
     dozen layers, which is compositor work: the animation keeps running at
     full rate through the second of solid main-thread arithmetic that
     generating an island costs.

     Every keyframe runs FROM a displaced state TO the element's ordinary one,
     and every rule's base styles are that settled state. So `animation: none`
     -- which is what the reduced-motion block at the bottom does -- leaves a
     finished picture rather than an invisible one. */

  .title {
    position: fixed; inset: 0; z-index: 40;
    display: grid; place-items: center;
    overflow: hidden; background: #070b18;
    transition: opacity 0.65s ease;
  }
  .title[hidden] { display: none; }
  /* Faded, then removed a beat later. The renderer's first frames are the ones
     most likely to hitch, and a title screen that vanishes on the frame the
     game starts is a title screen that shows the player that hitch. */
  .title.gone { opacity: 0; pointer-events: none; }

  .tt-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Darkens the corners and the horizon so the menu keeps its contrast no
     matter what the sky is doing underneath it. */
  .tt-veil {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 78% 62% at 50% 44%, rgba(5, 7, 10, 0) 0%, rgba(5, 7, 10, 0.5) 100%),
      linear-gradient(to bottom, rgba(5, 7, 10, 0.34), rgba(5, 7, 10, 0) 30%);
  }

  /* -- the sky ------------------------------------------------------------ */
  /* Day is a second full-height gradient laid over night and faded in, which
     is also what puts the stars out: they are between the two, so they go as
     the morning arrives rather than on a timer of their own. */
  .tt-day { opacity: 1; animation: tt-dawn 2.6s ease-out both; }
  @keyframes tt-dawn { from { opacity: 0; } to { opacity: 1; } }

  .tt-sun { transform: none; animation: tt-sunup 3s cubic-bezier(0.16, 0.7, 0.3, 1) both; }
  @keyframes tt-sunup { from { transform: translateY(255px); } to { transform: none; } }

  /* Two animations at once: a drift that never ends and the same dawn fade the
     sky uses. The group's `opacity` is the fade's to move, which is why the
     clouds carry their paleness as `fill-opacity` on the shapes instead. */
  .tt-cloud { opacity: 1; animation: tt-drift linear infinite, tt-dawn 3s ease-out both; }
  .tt-cloud-a { animation-duration: 96s, 3s; animation-delay: -30s, 0.5s; }
  .tt-cloud-b { animation-duration: 148s, 3s; animation-delay: -104s, 0.7s; }
  @keyframes tt-drift {
    from { transform: translateX(-420px); }
    to   { transform: translateX(1780px); }
  }

  /* `both` matters here: without a backwards fill the birds sit at their
     authored position on the left of the sky for the three seconds of delay
     and then jump offscreen to start their crossing. */
  .tt-birds { animation: tt-cross 34s linear 3.4s infinite both; }
  @keyframes tt-cross {
    from { transform: translate(-260px, 40px); }
    to   { transform: translate(1760px, -70px); }
  }
  /* fill-box, or the flap scales about the viewBox origin and the birds shear
     off the top of the sky instead of beating their wings. */
  .tt-bird { transform-box: fill-box; transform-origin: center; animation: tt-flap 0.62s ease-in-out infinite; }
  .tt-bird:nth-child(2) { animation-delay: -0.21s; }
  .tt-bird:nth-child(3) { animation-delay: -0.4s; }
  @keyframes tt-flap {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(0.42); }
  }

  /* -- the land ----------------------------------------------------------- */
  /* Three ridges, settling back to front a tenth of a second apart. The
     stagger is the only thing making this read as depth: they are flat shapes
     on a flat gradient, and what says one is behind another is that it stopped
     moving first. */
  .tt-ridge { transform: none; opacity: 1; animation: tt-settle 1.5s cubic-bezier(0.16, 0.8, 0.3, 1) both; }
  .tt-far  { animation-delay: 0.15s; }
  .tt-mid  { animation-delay: 0.32s; }
  .tt-near { animation-delay: 0.5s; }
  @keyframes tt-settle {
    from { transform: translateY(120px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* One lit window, because a light in a house is the shortest way to say that
     somebody lives in a place. */
  .tt-lamp { animation: tt-lamp 5.5s ease-in-out 2.6s infinite; }
  @keyframes tt-lamp {
    0%, 100% { opacity: 0.82; }
    50%      { opacity: 1; }
  }

  .tt-puff { transform-box: fill-box; transform-origin: center; animation: tt-smoke 7s linear infinite; }
  .tt-puff:nth-child(2) { animation-delay: -2.35s; }
  .tt-puff:nth-child(3) { animation-delay: -4.7s; }
  @keyframes tt-smoke {
    0%   { transform: translate(0, 0) scale(0.4); opacity: 0; }
    12%  { opacity: 0.5; }
    100% { transform: translate(-26px, -110px) scale(2.4); opacity: 0; }
  }

  /* -- the words and the menu --------------------------------------------- */
  .tt-stack {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    width: min(460px, calc(100vw - 28px));
    max-height: calc(100vh - 40px);
  }
  .tt-brand { text-align: center; margin-bottom: 16px; opacity: 1; animation: tt-rise 1.1s cubic-bezier(0.16, 0.8, 0.3, 1) 0.85s both; }
  .tt-name {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: clamp(38px, 7.4vw, 62px); font-weight: 600;
    letter-spacing: -0.015em; line-height: 1.05;
    color: #fbf6ec;
    text-shadow: 0 2px 3px rgba(5, 7, 10, 0.42), 0 14px 40px rgba(5, 7, 10, 0.62);
  }
  .tt-tag {
    margin-top: 7px;
    font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.72);
    letter-spacing: 0.17em; text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(5, 7, 10, 0.7);
  }
  @keyframes tt-rise {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: none; }
  }

  .tt-card {
    width: 100%; min-height: 0; overflow-y: auto; scrollbar-width: thin;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 14px 15px 15px;
    box-shadow: 0 18px 52px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(3px);
    opacity: 1; animation: tt-rise 1.1s cubic-bezier(0.16, 0.8, 0.3, 1) 1.15s both;
  }
  .tt-card.busy { opacity: 0.62; }
  /* Fixed ceiling rather than a free-growing card: twelve saves and sixteen
     landforms are both taller than a laptop, and a menu that pushes its own
     Start button off the bottom of the screen is a menu with no Start button. */
  .tt-list { max-height: min(46vh, 340px); overflow-y: auto; scrollbar-width: thin; }
  .tt-card .set-title:first-child { margin-top: 0; }

  /* Continue. Drawn as one wide sentence rather than as another row in the
     list, because carrying on where you were is not a choice among equals with
     the eleven older saves under it -- it is why most sessions open this
     screen at all. */
  .tt-go {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    font: inherit; color: var(--ink); cursor: pointer;
    background: rgba(127, 212, 168, 0.16); border: 1px solid var(--accent);
    border-radius: 11px; padding: 12px 14px; margin-bottom: 15px;
    transition: background 0.15s;
  }
  .tt-go:hover { background: rgba(127, 212, 168, 0.28); }
  .tt-go-lead {
    flex: none; font-size: 13px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .tt-go-body { flex: 1; min-width: 0; }
  .tt-go-name { display: block; font-size: 14px; font-weight: 650; }
  .tt-go-note {
    display: block; margin-top: 2px; font-size: 11px; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Reserved, so the card does not jump a line taller the moment a seed is
     described or a load goes wrong. */
  .tt-note {
    min-height: 2.6em; margin-top: 10px; padding: 0 4px;
    font-size: 11.5px; line-height: 1.5; text-align: center;
    color: rgba(255, 255, 255, 0.78);
    text-shadow: 0 1px 3px rgba(5, 7, 10, 0.8);
    opacity: 1; animation: tt-rise 1.1s ease-out 1.3s both;
  }
  .tt-note.bad { color: #ffb4b4; }

  .tt-go:focus-visible, .tt-card .pick:focus-visible, .tt-card .btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  @media (max-height: 620px) {
    .tt-brand { margin-bottom: 10px; }
    .tt-list { max-height: 34vh; }
  }

  /* The whole opening is decoration. Someone who has asked their system not to
     animate things gets the settled picture on the first frame -- which every
     rule above is already written to be. */
  @media (prefers-reduced-motion: reduce) {
    .title, .title * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="fade"></div>
  <!-- The title screen. Static markup on purpose -- see the comment on `.title`
       in the stylesheet above: this is the picture that covers the load, so it
       has to exist before the code that does the loading does. /src/ui/title.js
       fills in #title-card and #title-note and never touches the scene. -->
  <div id="title" class="title">
    <svg class="tt-scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="tt-g-night" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#05070f"/>
          <stop offset="52%" stop-color="#131f3a"/>
          <stop offset="100%" stop-color="#2a3a58"/>
        </linearGradient>
        <linearGradient id="tt-g-day" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#16406e"/>
          <stop offset="26%" stop-color="#5f9dc8"/>
          <stop offset="46%" stop-color="#f2cb93"/>
          <stop offset="64%" stop-color="#eda06f"/>
          <stop offset="100%" stop-color="#d0755b"/>
        </linearGradient>
        <radialGradient id="tt-g-glow">
          <stop offset="0%" stop-color="#ffe9bd" stop-opacity="0.9"/>
          <stop offset="45%" stop-color="#ffd191" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#ffc07f" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Night, the stars, then day laid over the top and faded in. The stars
           are BETWEEN the two gradients rather than fading on a timer of their
           own, so they go out because the morning arrived. -->
      <rect width="1600" height="900" fill="url(#tt-g-night)"/>
      <g fill="#e8eefc">
        <circle cx="118" cy="96" r="2.4" opacity=".85"/><circle cx="243" cy="188" r="1.7" opacity=".6"/>
        <circle cx="352" cy="72" r="2" opacity=".75"/><circle cx="470" cy="214" r="1.5" opacity=".5"/>
        <circle cx="586" cy="118" r="2.6" opacity=".9"/><circle cx="676" cy="46" r="1.6" opacity=".55"/>
        <circle cx="792" cy="176" r="2.1" opacity=".7"/><circle cx="905" cy="88" r="1.8" opacity=".62"/>
        <circle cx="1024" cy="206" r="2.3" opacity=".8"/><circle cx="1142" cy="120" r="1.5" opacity=".5"/>
        <circle cx="1258" cy="60" r="2.5" opacity=".85"/><circle cx="1366" cy="196" r="1.7" opacity=".58"/>
        <circle cx="1478" cy="104" r="2.2" opacity=".72"/><circle cx="1556" cy="238" r="1.6" opacity=".5"/>
        <circle cx="196" cy="292" r="1.5" opacity=".42"/><circle cx="742" cy="286" r="1.6" opacity=".45"/>
        <circle cx="1198" cy="308" r="1.5" opacity=".4"/><circle cx="52" cy="200" r="1.8" opacity=".55"/>
      </g>
      <rect class="tt-day" width="1600" height="900" fill="url(#tt-g-day)"/>

      <g class="tt-sun">
        <circle cx="1146" cy="452" r="268" fill="url(#tt-g-glow)"/>
        <circle cx="1146" cy="452" r="62" fill="#fff3d2"/>
      </g>

      <!-- fill-opacity on the shapes and never `opacity` on the group: the
           group's opacity is what the dawn fade animates, and a CSS `opacity`
           beats an SVG presentation attribute, so a cloud that carried its
           paleness on the group would be painted flat white the moment the
           stylesheet loaded. -->
      <g class="tt-cloud tt-cloud-a" fill="#fff" fill-opacity=".2">
        <ellipse cx="120" cy="196" rx="104" ry="27"/>
        <ellipse cx="196" cy="180" rx="70" ry="22"/>
        <ellipse cx="58" cy="186" rx="52" ry="18"/>
      </g>
      <g class="tt-cloud tt-cloud-b" fill="#fff" fill-opacity=".13">
        <ellipse cx="150" cy="320" rx="146" ry="24"/>
        <ellipse cx="252" cy="308" rx="86" ry="19"/>
      </g>

      <g class="tt-birds" fill="none" stroke="#2c3346" stroke-width="3.4" stroke-linecap="round">
        <path class="tt-bird" d="M0 300q11-9 21 0 10-9 21 0"/>
        <path class="tt-bird" d="M52 272q9-7 17 0 8-7 17 0"/>
        <path class="tt-bird" d="M96 316q8-6 15 0 7-6 15 0"/>
      </g>

      <!-- Far ridge. Cool and desaturated, because distance is haze and haze is
           the only thing keeping three flat green shapes from reading as one. -->
      <g class="tt-ridge tt-far">
        <path fill="#5b7f8d" d="M0 900V565c118-36 214 6 322-18 116-26 196 20 314-6 128-28 226 16 352-6 118-20 226 16 340-2 96-15 178 8 272-4v391z"/>
      </g>

      <g class="tt-ridge tt-mid">
        <path fill="#4a7a5c" d="M0 900V648c142-40 262 12 402-18 138-30 240 26 388 6 148-20 268 32 410 6 128-24 264 18 400-8v266z"/>
        <g fill="#3d6b50">
          <path d="M290 646l11-28 11 28zM292 630l9-24 9 24z"/>
          <path d="M382 636l10-26 10 26zM384 621l8-22 8 22z"/>
          <path d="M1236 646l10-26 10 26zM1238 631l8-22 8 22z"/>
          <path d="M1320 648l10-26 10 26zM1322 633l8-22 8 22z"/>
        </g>
      </g>

      <!-- Near hill: the one with somebody on it. Everything standing on this
           layer is bedded to the curve above, which runs y=748..758 across the
           whole width. A tree floating a hand's width off its own hill is the
           single loudest thing a scene like this can get wrong. -->
      <g class="tt-ridge tt-near">
        <path fill="#2e5139" d="M0 900V772c186-46 348 2 536-24 190-26 350 32 566 12 176-16 330 14 498-10v150z"/>

        <g>
          <rect x="556" y="690" width="106" height="58" rx="3" fill="#e9e2d3"/>
          <path fill="#d4614f" d="M544 694l65-44 65 44z"/>
          <!-- After the roof, or the roof covers it: the chimney's foot is
               meant to be buried in the tiles and its throat is not. -->
          <rect x="622" y="636" width="13" height="32" fill="#a8503e"/>
          <g fill="#dfe6ee">
            <circle class="tt-puff" cx="629" cy="634" r="9"/>
            <circle class="tt-puff" cx="629" cy="634" r="9"/>
